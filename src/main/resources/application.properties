# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/

# SQLite Database Configuration
spring.datasource.url=${MOVIEDB_DATABASE_URL:jdbc:sqlite:movies.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=${MOVIEDB_DDL_AUTO:create}
spring.jpa.show-sql=${MOVIEDB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQLite compatibility settings
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=none
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.text=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# SQL Initialization
spring.sql.init.mode=${MOVIEDB_SQL_INIT:always}

# Logging
logging.level.org.hibernate.SQL=${MOVIEDB_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.example.moviesapi=INFO

# Spring Data Configuration
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Static UI + API documentation
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Application Metadata
app.name=MovieDB
app.version=2.0.0
app.description=Movie database API, dashboard, search, relationships, statistics, and local SQLite storage
app.public-api-keys=${MOVIEDB_PUBLIC_API_KEYS:moviedb-demo-key,moviedb-readonly-key}
app.external.omdb-api-key=${OMDB_API_KEY:demo}
app.external.tmdb-api-key=${TMDB_API_KEY:}
app.cors.allowed-origins=${MOVIEDB_ALLOWED_ORIGINS:*}

# Validation and Error Handling
spring.mvc.throw-exception-if-no-handler-found=true

# SQLite Connection Pool Settings
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000
